# This workflow will do a clean install of node dependencies, build the source code and run tests and deploy to binary repo
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test

on:
  push:
  pull_request:

jobs:
  build:
    name: "build and test"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 #v5.1.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: node_modules
          # An explicit key for restoring and saving the cache
          key: foodpantry-labelbuster_node_modules-${{ hashFiles('package.json') }}
          restore-keys: |
            foodpantry-labelbuster_node_modules-${{ hashFiles('package.json') }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0 #820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
